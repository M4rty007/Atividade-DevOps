name: CI-CD

on:
  push: [main]
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - runs: pip install -r requirements.txt
      - runs: python -m pytest -q
